name: Deploy Laravel to Namecheap Backend

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.APP_FTP_HOST }}
        username: ${{ secrets.APP_FTP_USER }}
        password: ${{ secrets.APP_FTP_PSWD }}
        local-dir: ./api/
        server-dir: /
